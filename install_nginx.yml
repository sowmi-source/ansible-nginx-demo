---
- name: Install and start Nginx
  hosts: all
  become: yes

  tasks:
    - name: Install Nginx (Ubuntu/Debian)
      apt:
        name: nginx
        state: present
      when: ansible_os_family == "Debian"

    - name: Install Nginx (RHEL/Amazon Linux)
      yum:
        name: nginx
        state: present
      when: ansible_os_family == "RedHat"

    - name: Start Nginx service
      service:
        name: nginx
        state: started
        enabled: yes

     - name: Stop Nginx service
      service:
        name: nginx
        state: stoped
        enabled: yes
